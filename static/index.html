<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>AI Studio</title>
    <style>
        html.studio-route-booting body {
            visibility: hidden !important;
        }
    </style>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                document.documentElement.classList.add('studio-route-booting');
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.05.22"></script>
    <script src="/static/js/theme.js?v=2026.05.22"></script>
    <script src="/static/js/i18n.js?v=2026.05.22"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.05.22');

        /* 本地 Tailwind 工具類兜底：CDN 慢/未就緒時也能立刻給圖標尺寸，避免首屏左側欄空白 */
        .w-1\.5 { width: 0.375rem; }
        .h-1\.5 { height: 0.375rem; }
        .w-4 { width: 1rem; }
        .h-4 { height: 1rem; }
        .w-5 { width: 1.25rem; }
        .h-5 { height: 1.25rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .rounded-full { border-radius: 9999px; }
        .mb-12 { margin-bottom: 3rem; }
        .transition-colors { transition-property: color, background-color, border-color, fill, stroke; transition-duration: 150ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-pulse { animation: studio-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes studio-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        :root {
            --accent: #000000;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #ffffff;
            --sidebar-bg: #ffffff;
            --stage-bg: #fcfcfc;
            --border: #f2f2f2;
            --stage-border: #f0f0f0;
            --text: #121212;
            --muted: #999;
            --nav-hover-bg: #fafafa;
            --monitor-bg: rgba(255, 255, 255, 0.7);
            --monitor-border: rgba(0, 0, 0, 0.05);
            --monitor-shadow: rgba(0, 0, 0, 0.04);
            --divider: rgba(0, 0, 0, 0.1);
            --scrollbar: #d8d8d8;
            --scrollbar-hover: #c0c0c0;
            --author-name: #000;
            --social-icon: #ccc;
        }

        html.theme-dark,
        body.theme-dark {
            --bg: #0f141d;
            --sidebar-bg: #0f141d;
            --stage-bg: #111722;
            --border: #242d3b;
            --stage-border: #2a3444;
            --text: #e5e9f0;
            --muted: #8f9aab;
            --nav-hover-bg: #171d29;
            --monitor-bg: rgba(23, 29, 41, 0.82);
            --monitor-border: rgba(255, 255, 255, 0.08);
            --monitor-shadow: rgba(0, 0, 0, 0.3);
            --divider: rgba(255, 255, 255, 0.15);
            --scrollbar: #334155;
            --scrollbar-hover: #475569;
            --author-name: #e5e9f0;
            --social-icon: #64748b;
        }

        /* 極簡滾動條 */
        html,
        body {
            overscroll-behavior: auto;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* 側邊欄 */
        .sidebar {
            width: 80px;
            min-width: 80px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
            padding: 40px 0;
            transition: width 0.22s var(--fluid-ease), background 0.3s, border-color 0.3s;
            z-index: 50;
        }

        .sidebar.expanded {
            width: 220px;
        }
        .sidebar-toggle-btn {
            width:32px;
            height:32px;
            border-radius:999px;
            border:1px solid var(--border);
            background:var(--card);
            color:var(--muted);
            display:flex;
            align-items:center;
            justify-content:center;
            transition:background-color .2s, color .2s, border-color .2s, transform .2s;
            margin-top:-6px;
            margin-bottom:14px;
        }
        .sidebar-toggle-btn:hover { background:var(--nav-hover-bg); color:var(--text); }
        .sidebar.expanded .sidebar-toggle-btn svg { transform:rotate(180deg); }

        /* 首次加載時與 iframe 的 0.5s 淡入同步播放，避免側欄"焊死"在原地造成視覺斷層 */
        @keyframes sidebar-enter {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
        html:not(.studio-route-booting) .sidebar {
            animation: sidebar-enter 0.5s var(--fluid-ease);
        }

        .logo-ring {
            width: 36px;
            height: 36px;
            border: 2px solid var(--text);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 僅保留 hover 真正會用到的屬性過渡，避免 transition: all 因首屏屬性補齊被意外觸發 */
            transition: transform 0.2s var(--fluid-ease), border-radius 0.2s var(--fluid-ease), border-color 0.3s;
        }

        .sidebar.expanded .logo-ring {
            transform: rotate(90deg);
            border-radius: 50%;
        }

        /* 導航項 */
        .nav-item {
            position: relative;
            width: 48px;
            height: 48px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 18px;
            cursor: pointer;
            /* 只對 width 做帶延遲的過渡（側欄懸停展開效果）；background/color 不參與過渡，避免 active 切換時底色"流動" */
            transition: width 0.2s var(--fluid-ease);
            color: var(--muted);
            overflow: hidden;
            padding-left: 14px;
        }

        .sidebar.expanded .nav-item {
            width: 190px;
        }

        .nav-item:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent);
            color: #fff;
        }

        html.theme-dark .nav-item.active,
        body.theme-dark .nav-item.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        .nav-text {
            opacity: 0;
            margin-left: 16px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        .sidebar.expanded .nav-text {
            opacity: 1;
        }

        /* 主舞臺區 */
        .stage {
            flex: 1;
            background: var(--stage-bg);
            margin: 16px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transform: scale(1.02);
            filter: blur(4px);
            transition: all 0.5s var(--fluid-ease);
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
            pointer-events: auto;
        }

        /* 左下角監視器 */
        .nano-monitor {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--monitor-bg);
            backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid var(--monitor-border);
            box-shadow: 0 4px 20px var(--monitor-shadow);
            font-family: monospace;
            transition: all 0.4s var(--fluid-ease);
        }

        .nano-monitor.is-busy {
            background: #000;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
        }

        .nano-monitor.is-busy .stat-group {
            color: #fff;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: var(--divider);
        }

        .is-busy .divider {
            background: rgba(255, 255, 255, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }

        .spinner-nano {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .is-busy .spinner-nano { display: block; }
        .is-busy .pulse-dot { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .label-nano {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            font-size: 9px;
        }

        /* 作者組件 */
        .author-box {
            width: 100%;
            height: 60px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .dx-letter {
            position: absolute;
            font-size: 14px;
            font-weight: 800;
            color: var(--text);
            /* 只過渡 hover 時真正改的 transform/opacity，避免 all 觸發延遲 */
            transition: transform 0.2s var(--fluid-ease), opacity 0.2s var(--fluid-ease);
            z-index: 10;
        }

        .letter-d { transform: translateX(-8px); }
        .letter-x { transform: translateX(8px); }

        .sidebar.expanded .letter-d {
            transform: translateX(-120px);
            opacity: 0;
        }

        .sidebar.expanded .letter-x {
            transform: translateX(120px);
            opacity: 0;
        }

        .author-content-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s var(--fluid-ease) 0s;
            pointer-events: none;
        }

        .sidebar.expanded .author-content-wrap {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .author-name-lite {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--author-name);
        }

        .social-row-lite { display: flex; gap: 12px; }

        .social-icon-lite {
            color: var(--social-icon);
            transition: color 0.2s, transform 0.2s;
        }

        .social-icon-lite:hover {
            color: var(--text);
            transform: translateY(-1px);
        }

        .side-actions {
            margin-top:auto;
            margin-bottom:12px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            width:100%;
        }

        .side-pill {
            width:44px;
            height:36px;
            border-radius:999px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* 只過渡 hover/激活會改的屬性，避免 all 觸發延遲 */
            transition: width 0.2s var(--fluid-ease), gap 0.2s var(--fluid-ease), background-color 0.2s, color 0.2s, border-color 0.2s;
            flex-shrink: 0;
            overflow:hidden;
            gap:8px;
            position:relative;
        }

        .sidebar.expanded .side-pill {
            width: 170px;
        }

        .side-pill:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .side-pill.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .side-pill.update-available {
            border-color:#22c55e;
            color:#16a34a;
            overflow:visible;
        }

        html.theme-dark .side-pill.update-available,
        body.theme-dark .side-pill.update-available {
            border-color:#86efac;
            color:#86efac;
        }

        .side-pill.update-available::after {
            content:"NEW";
            position:absolute;
            top:-7px;
            right:-9px;
            min-width:28px;
            height:16px;
            padding:0 5px;
            border-radius:999px;
            background:#22c55e;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:9px;
            font-weight:900;
            letter-spacing:.02em;
            box-shadow:0 6px 16px rgba(34,197,94,.28), 0 0 0 3px rgba(34,197,94,.12);
            pointer-events:none;
        }

        html.theme-dark .side-pill.update-available::after,
        body.theme-dark .side-pill.update-available::after {
            background:#4ade80;
            color:#052e16;
            box-shadow:0 6px 16px rgba(74,222,128,.22), 0 0 0 3px rgba(74,222,128,.12);
        }

        .side-pill svg { width: 16px; height: 16px; flex:0 0 auto; }
        .side-pill-text {
            opacity:0;
            max-width:0;
            font-size:12px;
            font-weight:800;
            letter-spacing:.02em;
            white-space:nowrap;
            overflow:hidden;
            transition: opacity 0.2s, max-width 0.2s var(--fluid-ease);
        }
        .sidebar.expanded .side-pill-text {
            opacity:1;
            max-width:120px;
        }
        /* 摺疊態去除 gap，避免圖標被推偏 */
        .side-pill { gap:0; }
        .sidebar.expanded .side-pill { gap:8px; }

        .update-now-btn {
            display:none;
            width:44px;
            height:30px;
            border-radius:999px;
            border:1px solid rgba(34,197,94,.35);
            background:rgba(34,197,94,.1);
            color:#16a34a;
            align-items:center;
            justify-content:center;
            gap:7px;
            font-size:11px;
            font-weight:900;
            overflow:hidden;
            transition:width 0.2s var(--fluid-ease), background-color .2s, color .2s, border-color .2s;
        }
        .update-now-btn.show { display:flex; }
        .sidebar.expanded .update-now-btn { width:170px; }
        .update-now-btn:hover { background:#16a34a; color:#fff; border-color:#16a34a; }
        .update-now-btn[disabled] { opacity:.7; cursor:wait; }
        .update-now-btn svg { width:14px; height:14px; flex:0 0 auto; }
        .update-now-text {
            opacity:0;
            max-width:0;
            white-space:nowrap;
            overflow:hidden;
            transition: opacity 0.2s, max-width 0.2s var(--fluid-ease);
        }
        .sidebar.expanded .update-now-text { opacity:1; max-width:110px; }
        html.theme-dark .update-now-btn,
        body.theme-dark .update-now-btn {
            border-color:rgba(134,239,172,.42);
            background:rgba(74,222,128,.12);
            color:#86efac;
        }
        html.theme-dark .update-now-btn:hover,
        body.theme-dark .update-now-btn:hover {
            background:#86efac;
            border-color:#86efac;
            color:#052e16;
        }
    </style>
</head>

<body>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo-ring mb-12">
                <div class="w-1.5 h-1.5 rounded-full transition-colors" id="logo-dot" style="background:var(--text)"></div>
            </div>
            <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" type="button" title="切換側欄">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <nav>
                <div class="nav-item" onclick="switchUI(this, 'enhance')">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span class="nav-text" data-i18n="nav.enhance">細節增強</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'angle')">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    <span class="nav-text" data-i18n="nav.angle">角度控制</span>
                </div>

                <!-- 分隔線 -->
                <div style="width:32px;height:1px;background:var(--border);margin:8px auto;transition:background 0.3s;"></div>

                <div class="nav-item active" onclick="switchUI(this, 'online')">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"></path>
                        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span class="nav-text" data-i18n="nav.online">在線生圖</span>
                </div>
                <div class="nav-item" onclick="switchUI(this, 'canvas')">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span class="nav-text" data-i18n="nav.canvas">無限畫布</span>
                </div>
            </nav>

            <div class="side-actions">
                <button class="side-pill" onclick="toggleTheme()" id="theme-toggle-btn" type="button" title="切換夜間模式">
                    <svg id="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="icon-sun" style="display:none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <span class="side-pill-text" data-i18n="common.darkMode">黑夜模式</span>
                </button>
                <button class="side-pill" onclick="toggleLanguage()" id="lang-toggle-btn" type="button" title="Language">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M2 12h20"></path>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span class="side-pill-text" data-i18n="common.language">中文</span>
                </button>
                <button class="side-pill" onclick="switchUI(this, 'api-settings')" type="button" title="API 設置">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 7h3a5 5 0 0 1 0 10h-3"></path>
                        <path d="M9 17H6A5 5 0 0 1 6 7h3"></path>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <span class="side-pill-text" data-i18n="common.apiSettings">API 設置</span>
                </button>
                <button class="side-pill" onclick="switchUI(this, 'comfyui-settings')" type="button" title="ComfyUI 設置">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        <path d="M14 14h7v7h-7z"></path>
                        <line x1="10" y1="6.5" x2="14" y2="6.5"></line>
                        <line x1="6.5" y1="10" x2="6.5" y2="14"></line>
                    </svg>
                    <span class="side-pill-text" data-i18n="common.comfyuiSettings">ComfyUI 設置</span>
                </button>
                <button id="update-now-btn" class="update-now-btn" onclick="runProjectUpdate()" type="button" title="一鍵更新">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <path d="M21 3v6h-6"></path>
                    </svg>
                    <span id="update-now-text" class="update-now-text" data-i18n="update.oneClick">一鍵更新</span>
                </button>
                <div id="auth-user-chip" class="side-pill" style="cursor:default;opacity:.92">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21a8 8 0 1 0-16 0"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span id="auth-user-text" class="side-pill-text">--</span>
                </div>
                <button id="logout-btn" class="side-pill" type="button" title="登出">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span class="side-pill-text">登出</span>
                </button>
            </div>

        </aside>
        <script>
            /* 在側欄 DOM 解析完後立即把 active 類移到當前頁對應的入口，避免首屏先在文生圖上閃一下 */
            (function(){
                try {
                    var pageId = localStorage.getItem('studio_active_page');
                    if(pageId && pageId !== 'online') {
                        document.querySelectorAll('.nav-item.active, .side-pill.active').forEach(function(n){
                            n.classList.remove('active');
                        });
                        var target = document.querySelector('[onclick*="\'' + pageId + '\'"]');
                        if(target) target.classList.add('active');
                    }
                } catch(e) {}
            })();
        </script>

        <main class="stage">
            <iframe id="frame-zimage" data-src="/static/zimage.html?v=2026.05.22" scrolling="yes"></iframe>
            <iframe id="frame-enhance" data-src="/static/enhance.html?v=2026.05.22" scrolling="yes"></iframe>
            <iframe id="frame-klein" data-src="/static/klein.html?v=2026.05.22" scrolling="yes"></iframe>
            <iframe id="frame-angle" data-src="/static/angle.html?v=2026.05.22" scrolling="yes"></iframe>
            <iframe id="frame-online" data-src="/static/online.html?v=2026.05.24.2" class="active" scrolling="yes"></iframe>
            <iframe id="frame-gpt-chat" data-src="/static/gpt-chat.html?v=2026.05.22" scrolling="yes"></iframe>
            <iframe id="frame-canvas" data-src="/static/canvas.html?v=2026.05.24.11" scrolling="yes"></iframe>
            <iframe id="frame-api-settings" data-src="/static/api-settings.html?v=2026.05.22" scrolling="yes"></iframe>
            <iframe id="frame-comfyui-settings" data-src="/static/comfyui-settings.html?v=2026.05.22" scrolling="yes"></iframe>

            <div class="nano-monitor" id="nano-monitor">
                <div class="stat-group">
                    <div class="pulse-dot animate-pulse"></div>
                    <div class="spinner-nano"></div>
                    <span class="label-nano">ONLINE</span>
                    <span id="online-val">1</span>
                </div>
                <div class="divider"></div>
                <div class="stat-group">
                    <span class="label-nano">QUEUE</span>
                    <span id="queue-val">0</span>
                </div>
            </div>
        </main>

    <script>
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);
        const ACTIVE_PAGE_KEY = 'studio_active_page';
        const SIDEBAR_EXPANDED_KEY = 'studio_sidebar_expanded';
        const DEFAULT_PAGE_ID = 'online';
        const PAGE_IDS = ['enhance','angle','online','canvas','api-settings','comfyui-settings'];
        let appInfo = { version:'', repo_url:'', version_url:'https://raw.githubusercontent.com/hero8152/Infinite-Canvas/main/VERSION' };
        const authUserTextEl = document.getElementById('auth-user-text');
        const logoutBtnEl = document.getElementById('logout-btn');
        const sidebarEl = document.querySelector('.sidebar');
        const sidebarToggleBtnEl = document.getElementById('sidebar-toggle-btn');

        function applySidebarExpanded(expanded){
            if(!sidebarEl) return;
            const on = Boolean(expanded);
            sidebarEl.classList.toggle('expanded', on);
            localStorage.setItem(SIDEBAR_EXPANDED_KEY, on ? '1' : '0');
        }

        function toggleSidebarExpanded(){
            if(!sidebarEl) return;
            applySidebarExpanded(!sidebarEl.classList.contains('expanded'));
        }
        applySidebarExpanded(localStorage.getItem(SIDEBAR_EXPANDED_KEY) === '1');

        function switchUI(el, id, options = {}) {
            if(!PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
            document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            target.classList.add('active');
            if (!target.src) target.src = target.dataset.src;
            if(!options.skipRemember) localStorage.setItem(ACTIVE_PAGE_KEY, id);
            // sync theme to newly activated iframe
            syncThemeToFrame(target);
            syncLanguageToFrame(target);
            // 切換到畫布時通知刷新工作流列表（防止在 comfyui-settings 修改後畫布未及時更新）
            if (id === 'canvas' && target.src) {
                try { target.contentWindow?.postMessage({ type: 'canvas-focus' }, '*'); } catch(e) {}
            }
        }

        function restoreActivePage() {
            const id = PAGE_IDS.includes(localStorage.getItem(ACTIVE_PAGE_KEY)) ? localStorage.getItem(ACTIVE_PAGE_KEY) : DEFAULT_PAGE_ID;
            const trigger = document.querySelector(`[onclick*="'${id}'"],[onclick*='"${id}"']`);
            switchUI(trigger, id, { skipRemember:true });
            document.documentElement.classList.remove('studio-route-booting');
        }
        document.addEventListener('DOMContentLoaded', restoreActivePage, { once:true });

        async function refreshAuthUser() {
            if(!authUserTextEl) return;
            authUserTextEl.textContent = '--';
            try {
                const res = await fetch('/api/auth/me', { credentials:'include' });
                if(!res.ok){
                    window.location.href = '/login';
                    return;
                }
                const data = await res.json();
                const user = data?.user || {};
                const workspace = data?.workspace || {};
                const name = (user.display_name || '').trim() || (user.email || '').trim() || 'User';
                const ws = (workspace.name || '').trim();
                const text = ws ? `${name} @ ${ws}` : name;
                authUserTextEl.textContent = text;
                authUserTextEl.title = text;
            } catch(e) {
                authUserTextEl.textContent = '--';
            }
        }

        async function logoutCurrentUser() {
            try {
                await fetch('/api/auth/logout', {
                    method:'POST',
                    credentials:'include',
                    headers:{'Content-Type':'application/json'}
                });
            } catch(e) {}
            window.location.href = '/login';
        }

        async function syncStatus() {
            try {
                const res = await fetch(`/api/queue_status?client_id=${CID}`);
                const data = await res.json();
                const monitor = document.getElementById('nano-monitor');
                const queueVal = document.getElementById('queue-val');
                const logoDot = document.getElementById('logo-dot');
                const total = data.total || 0;
                const pos = data.position || 0;
                if (pos > 0) {
                    monitor.classList.add('is-busy');
                    queueVal.innerText = `${pos}/${total}`;
                    logoDot.style.backgroundColor = '#3b82f6';
                } else {
                    monitor.classList.remove('is-busy');
                    queueVal.innerText = total > 0 ? total : '0';
                    logoDot.style.backgroundColor = 'var(--text)';
                }
            } catch (e) { }
        }

        const host = window.location.host;
        if (host) {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${host}/ws/stats?client_id=${CID}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'stats') {
                    document.getElementById('online-val').innerText = data.online_count;
                } else if (data.type === 'cloud_status') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'canvas_updated') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                }
            };
            setInterval(syncStatus, 2000);
        }

        // --- 夜間模式 ---

        function syncThemeToFrame(iframe) {
            const theme = (window.StudioTheme || {get: () => 'light'}).get();
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-theme', theme }, '*');
                }
            } catch (e) {}
        }

        function broadcastTheme(theme) {
            if (window.StudioTheme) {
                window.StudioTheme.set(theme);
            }
            document.querySelectorAll('iframe').forEach(f => syncThemeToFrame(f));
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const moon = document.getElementById('icon-moon');
            const sun = document.getElementById('icon-sun');
            if (theme === 'dark') {
                moon.style.display = 'none';
                sun.style.display = 'block';
            } else {
                moon.style.display = 'block';
                sun.style.display = 'none';
            }
        }

        function toggleTheme() {
            const current = window.StudioTheme ? window.StudioTheme.get() : 'light';
            broadcastTheme(current === 'dark' ? 'light' : 'dark');
        }

        function toggleLanguage() {
            if(!window.StudioI18n) return;
            window.StudioI18n.toggle();
            document.querySelectorAll('iframe').forEach(frame => syncLanguageToFrame(frame));
            updateProjectUpdateTitle();
        }

        function syncLanguageToFrame(frame) {
            if(!window.StudioI18n) return;
            try {
                frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
            } catch(e) {}
        }

        function broadcastLanguage() {
            document.querySelectorAll('iframe').forEach(frame => {
                try {
                    frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
                } catch(e) {}
            });
        }

        // listen for theme changes triggered by theme.js
        window.addEventListener('studio-theme-change', (e) => {
            updateThemeIcon(e.detail.theme);
        });

        // init icon state on load
        window.addEventListener('DOMContentLoaded', () => {
            const theme = window.StudioTheme ? window.StudioTheme.get() : 'light';
            updateThemeIcon(theme);
            if(window.StudioI18n) window.StudioI18n.apply();
            broadcastLanguage();
            if(sidebarToggleBtnEl){
                sidebarToggleBtnEl.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleSidebarExpanded();
                });
            }
            if(logoutBtnEl){
                logoutBtnEl.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    logoutCurrentUser();
                });
            }
            refreshAuthUser();
            checkForUpdates();
        });

        // sync theme when iframe loads
        document.querySelectorAll('iframe').forEach(f => {
            f.addEventListener('load', () => {
                syncThemeToFrame(f);
                syncLanguageToFrame(f);
            });
        });

        function versionParts(value) {
            return String(value || '').match(/\d+/g)?.map(Number) || [];
        }

        function compareVersions(a, b) {
            const aa = versionParts(a);
            const bb = versionParts(b);
            const len = Math.max(aa.length, bb.length);
            for(let i = 0; i < len; i++){
                const diff = (aa[i] || 0) - (bb[i] || 0);
                if(diff) return diff;
            }
            return String(a || '').trim() === String(b || '').trim() ? 0 : 1;
        }

        function updateProjectUpdateTitle() {
            const gitBtn = document.getElementById('github-entry-btn');
            if(!gitBtn?.classList.contains('update-available')) return;
            const remoteVersion = gitBtn.dataset.remoteVersion || '';
            const isEn = window.StudioI18n?.lang?.() === 'en';
            gitBtn.title = isEn ? `New version available: ${remoteVersion || '-'}` : `發現新版本：${remoteVersion || '-'}`;
            const updateBtn = document.getElementById('update-now-btn');
            if(updateBtn) updateBtn.title = isEn ? 'Update main.py and static files from GitHub' : '從 GitHub 更新 main.py 和 static 文件';
        }

        function showUpdateNotice(localVersion, remoteVersion) {
            const gitBtn = document.getElementById('github-entry-btn');
            if(!gitBtn) return;
            gitBtn.classList.add('update-available');
            gitBtn.dataset.localVersion = localVersion || '';
            gitBtn.dataset.remoteVersion = remoteVersion || '';
            document.getElementById('update-now-btn')?.classList.add('show');
            updateProjectUpdateTitle();
        }

        function describeNetworkError(err, isEn){
            const msg = String(err?.message || err || '');
            const isNetwork = (err instanceof TypeError) || /Failed to fetch|NetworkError|ERR_|timed? ?out|超時|無法連接|GitHub|HTTP 4|HTTP 5/i.test(msg);
            if(isNetwork){
                return isEn
                    ? 'Cannot reach GitHub. Please make sure this machine has internet access (and can reach github.com / raw.githubusercontent.com). If you are in a restricted network you may need a proxy or VPN.'
                    : '無法連接 GitHub。請檢查本機網絡是否能訪問外網（特別是 github.com / raw.githubusercontent.com）。如果在受限網絡中，可能需要走代理或外網環境再試。';
            }
            return msg || (isEn ? 'Update failed' : '更新失敗');
        }

        async function runProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const askMessage = isEn
                ? 'Update main.py, VERSION, and static files from GitHub now? A backup will be created. Click OK to update and auto-restart the backend. Requires an internet connection (github.com).'
                : '現在從 GitHub 更新 main.py、VERSION 和 static 文件嗎？更新前會自動備份，更新後將自動重啓後端。需要本機能訪問外網（github.com）。';
            if(!confirm(askMessage)) return;
            const btn = document.getElementById('update-now-btn');
            const text = document.getElementById('update-now-text');
            const oldText = text?.textContent || '';
            if(btn) btn.disabled = true;
            if(text) text.textContent = isEn ? 'Updating...' : '更新中...';
            try {
                const res = await fetch('/api/update-from-github', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ auto_restart:true, restart_delay:3 })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Update failed' : '更新失敗'));
                const restarting = data.restart_scheduled;
                const done = restarting
                    ? (isEn
                        ? `Updated ${data.count || 0} files. The backend will restart in ~3 seconds. This page will auto-reload when it's back.`
                        : `已更新 ${data.count || 0} 個文件。後端將在約 3 秒後自動重啓，本頁面在後端恢復後會自動刷新。`)
                    : (isEn
                        ? `Updated ${data.count || 0} files. Please restart the backend, then refresh this page.`
                        : `已更新 ${data.count || 0} 個文件。請重啓後端，然後刷新頁面。`);
                alert(done);
                document.getElementById('github-entry-btn')?.classList.remove('update-available');
                btn?.classList.remove('show');
                if(restarting) waitForBackendAndReload();
            } catch(e) {
                alert((isEn ? 'Update failed: ' : '更新失敗：') + describeNetworkError(e, isEn));
            } finally {
                if(btn) btn.disabled = false;
                if(text) text.textContent = oldText || (isEn ? 'Update' : '一鍵更新');
            }
        }
        async function waitForBackendAndReload() {
            const deadline = Date.now() + 90 * 1000;
            await new Promise(r => setTimeout(r, 4000));
            while(Date.now() < deadline) {
                try {
                    const r = await fetch('/api/app-info', { cache:'no-store' });
                    if(r.ok) { location.reload(); return; }
                } catch {}
                await new Promise(r => setTimeout(r, 1500));
            }
        }
        async function rollbackProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            try {
                const list = await fetch('/api/update-backups').then(r => r.json());
                const backups = list.backups || [];
                if(!backups.length){ alert(isEn ? 'No backups available.' : '沒有可用的備份'); return; }
                const lines = backups.slice(0, 8).map((b, i) => {
                    const d = new Date((b.created_at || 0) * 1000);
                    const ts = d.toLocaleString();
                    return `${i + 1}. ${b.name}  (${b.file_count} files, ${ts})`;
                });
                const promptMsg = (isEn
                    ? 'Select a backup to restore (enter the number):\n'
                    : '選擇要還原的備份（輸入序號）：\n') + lines.join('\n');
                const answer = prompt(promptMsg, '1');
                const idx = Number(answer) - 1;
                if(!(idx >= 0 && idx < backups.length)) return;
                const target = backups[idx];
                if(!confirm(isEn ? `Restore "${target.name}"? Backend will restart.` : `要還原 "${target.name}" 嗎？後端會自動重啓。`)) return;
                const res = await fetch('/api/update-rollback', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ name:target.name, auto_restart:true, restart_delay:3 })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Rollback failed' : '回滾失敗'));
                alert(isEn
                    ? `Restored ${data.count || 0} files. Backend is restarting.`
                    : `已還原 ${data.count || 0} 個文件。後端正在重啓。`);
                if(data.restart_scheduled) waitForBackendAndReload();
            } catch(e) {
                alert((isEn ? 'Rollback failed: ' : '回滾失敗：') + describeNetworkError(e, isEn));
            }
        }
        window.rollbackProjectUpdate = rollbackProjectUpdate;

        async function checkForUpdates() {
            try {
                const info = await fetch('/api/app-info', { cache:'no-store' }).then(r => r.json());
                appInfo = {...appInfo, ...info};
                const current = String(appInfo.version || '').trim();
                const remoteText = await fetch(`${appInfo.version_url || ''}?t=${Date.now()}`, { cache:'no-store' }).then(r => r.ok ? r.text() : '');
                const remote = String(remoteText || '').trim().split(/\r?\n/)[0].trim();
                if(current && remote && compareVersions(remote, current) > 0) showUpdateNotice(current, remote);
            } catch(e) {
                // 離線包裏沒有網絡時保持安靜，不影響本地使用。
            }
        }
    </script>
